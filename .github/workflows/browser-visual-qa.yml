name: notGoogle Browser Visual QA
on:
  push:
    branches:
      - 'experiment/**'
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture four viewports and exercise UI
        run: node tests/browser-visual.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notgoogle-browser-qa
          path: artifacts/browser-qa
          retention-days: 14
          if-no-files-found: warn
